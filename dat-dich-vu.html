<main>
<section id="dat-dich-vu">

    <h2>Đặt dịch vụ</h2>

    <form action="#" method="post">

        <p>
            <label for="ho-ten">Họ và tên:</label>
            <input id="ho-ten" name="hoTen" type="text" required>
        </p>

        <p>
            <label for="so-dien-thoai">Số điện thoại:</label>
            <input id="so-dien-thoai" name="soDienThoai" type="tel" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input id="email" name="email" type="email">
        </p>

        <p>
            <label for="dich-vu">Dịch vụ:</label>
            <select id="dich-vu" name="dichVu" required>
                <option value="">-- Chọn dịch vụ --</option>
                <option value="ve-sinh-may-tinh">Vệ sinh máy tính</option>
                <option value="sua-loi-may-tinh">Sửa lỗi máy tính</option>
                <option value="thay-keo-tan-nhiet">Thay keo tản nhiệt</option>
                <option value="cai-windows">Cài Windows</option>
                <option value="kiem-tra-loi-may-tinh">Kiểm tra lỗi máy tính</option>
            </select>
        </p>

        <p>
            <label for="ngay-su-dung">Ngày sử dụng:</label>
            <input id="ngay-su-dung" name="ngaySuDung" type="date">
        </p>

        <p>
            <label for="mo-ta">Mô tả tình trạng máy:</label><br>
            <textarea id="mo-ta" name="moTa" rows="5" cols="40"></textarea>

    </form>

</section>
</main>
